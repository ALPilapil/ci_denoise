[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "cidenoise"
version = "1.0.0"
description = "Turnkey Biophysical Disentanglement & Neural Network Denoising for Cochlear Implant EEG"
readme = "README.md"
requires-python = ">=3.9"
authors = [
    { name = "Evan Liang", email = "evliang@ucdavis.edu" }
]
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Topic :: Scientific/Engineering :: Medical Science Apps.",
    "Topic :: Scientific/Engineering :: Bio-Informatics"
]
dependencies = [
    "numpy>=1.20.0",
    "scipy>=1.7.0",
    "mne>=1.0.0",
    "torch>=1.12.0",
    "pandas>=1.3.0",
    "matplotlib>=3.5.0"
]

[project.scripts]
cidenoise = "cidenoise.cli:main"
